name:  Deploy website on push
on:
  push:
    branches:
      - main
jobs:
  web-deploy:
    name:  Deploy
    runs-on: ubuntu-latest
    steps:
    - name:  Get latest code
      uses: actions/checkout@v3
    
    - name:  Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftp.transport.greenholidaytravels.com
        username: ${{ secrets.ishini@greenholidaytravels.com}}
        password: ${{ secrets.kf620$sd5%sfABew2 }}
        server-dir: /public_html/