# Deliberately does NOT deploy on push: a source-only FTP sync cannot run
# a Next.js server app and could expose internal files in public_html.
name: Verify an already deployed release

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "HTTPS origin of the deployed Next.js app (for example https://transport.example.com)"
        required: true
        type: string
      expected_sha:
        description: "Full 40-character commit SHA configured as DEPLOY_COMMIT_SHA on the host"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-deployed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - name: Verify HTTPS, landing page and exact deployed SHA
        env:
          RELEASE_BASE_URL: ${{ inputs.base_url }}
          RELEASE_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/verify-release.mjs
